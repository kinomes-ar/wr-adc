<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WR 원딜 픽</title>
<meta name="description" content="와일드리프트 원딜 픽 가이드 — 서폿·상대 조합별 단계 추천">
<meta name="theme-color" content="#0B0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏹</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0B0E13;--card:#161B24;--card2:#1A212C;--line:#242C3A;--line2:#1B212C;
 --tx:#E8ECF2;--dim:#8B96A8;--dim2:#69748A;--good:#4ADE80;--bad:#F87171;--warn:#F0B45E;--blue:#8FB9E8}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);line-height:1.5;
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
 -webkit-font-smoothing:antialiased;font-size:15px;
 padding:0 max(14px,env(safe-area-inset-left)) calc(30px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}
.wrap{max-width:560px;margin:0 auto}

header{padding:14px 0 10px;display:flex;align-items:baseline;gap:8px}
h1{font-size:16px;font-weight:800;letter-spacing:-.02em}
header span{font-size:10.5px;color:var(--dim2)}
nav{display:flex;gap:5px;padding:5px 0 9px;position:sticky;top:0;background:var(--bg);z-index:30}
nav button{flex:1;padding:9px 4px;border:1px solid var(--line);background:var(--card);color:var(--dim);
 border-radius:9px;font-size:12.5px;font-weight:700;font-family:inherit}
nav button.on{background:#213047;color:#fff;border-color:#3A5578}
.panel{display:none}.panel.on{display:block}

/* ── 추천 카드 ── */
.hero{border:1px solid #2B4A38;background:linear-gradient(180deg,#132218,#101720);border-radius:14px;
 padding:14px 15px;margin-bottom:12px}
.hero .lbl{font-size:10px;font-weight:800;letter-spacing:.1em;color:#5EBF82;margin-bottom:6px}
.hero .big{font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1.15}
.hero .big em{font-style:normal;font-size:11px;font-weight:700;color:var(--warn);
 border:1px solid #453520;border-radius:5px;padding:2px 6px;margin-left:8px;vertical-align:4px}
.hero .sub{font-size:12px;color:#A8B6C6;margin-top:6px;line-height:1.55}
.hero.warnbox{border-color:#5A3E1E;background:linear-gradient(180deg,#1E1710,#12151A)}
.hero.warnbox .lbl{color:var(--warn)}
.hero.badbox{border-color:#5A2A2E;background:linear-gradient(180deg,#1E1315,#12151A)}
.hero.badbox .lbl{color:var(--bad)}
.alts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.alts b{font-size:11px;color:var(--dim2);font-weight:700;align-self:center}
.alts span{font-size:12px;font-weight:700;background:#1A2430;border:1px solid var(--line);
 border-radius:20px;padding:4px 10px;color:#C4D0DE}

.hint{font-size:11.5px;color:var(--dim2);background:var(--card);border:1px dashed var(--line);
 border-radius:10px;padding:9px 12px;margin-bottom:14px;line-height:1.55}
.hint b{color:var(--blue);font-weight:700}

/* ── 단계 ── */
.step{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card);overflow:hidden}
.step>summary{padding:12px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;
 cursor:pointer;list-style:none}
.step>summary::-webkit-details-marker{display:none}
.step>summary .n{width:19px;height:19px;border-radius:50%;background:#26313F;color:var(--dim);
 font-size:10.5px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.step.done>summary .n{background:#1E4230;color:var(--good)}
.step>summary .pick{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue);
 max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.step>summary .pick.none{color:var(--dim2);font-weight:500}
.body{padding:0 12px 12px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:7px 11px;border:1px solid var(--line);background:var(--card2);color:var(--dim);
 border-radius:20px;font-size:12.5px;font-weight:600;font-family:inherit;line-height:1.25}
.chip.on{background:#23405E;border-color:#4276AB;color:#EAF2FB}
.chip small{display:block;font-size:9px;color:var(--dim2);font-weight:500;margin-top:2px}
.chip.on small{color:#9FC0E0}
.chip .ex{opacity:.75}
.reset{width:100%;margin-top:12px;padding:11px;border:1px solid var(--line);background:none;
 color:var(--dim2);border-radius:10px;font-size:12.5px;font-weight:700;font-family:inherit}

/* ── 순위 ── */
.rank{margin-top:14px}
.rank>h3{font-size:11px;font-weight:800;color:var(--dim2);letter-spacing:.07em;margin-bottom:8px}
.row{display:flex;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;
 margin-bottom:6px;background:var(--card);align-items:flex-start}
.row.no{opacity:.5}
.rk{flex:0 0 18px;font-size:13px;font-weight:900;color:var(--dim2);padding-top:1px}
.mid{flex:1;min-width:0}
.nm{font-size:14px;font-weight:800}
.nm .tier{font-size:9px;font-weight:800;color:var(--warn);border:1px solid #453520;
 border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:1px}
.rs{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.rs div{font-size:11px;line-height:1.45;color:var(--dim)}
.rs b{font-weight:700;color:#A9B6C6}
.rs .p{color:#8FD8AB}.rs .m{color:#E39B9B}
.sc{flex:0 0 auto;font-size:13px;font-weight:900;padding-top:1px}
.sc.p{color:var(--good)}.sc.m{color:var(--bad)}.sc.z{color:var(--dim2)}

/* ── 치트 / 상세 ── */
table{width:100%;border-collapse:collapse;font-size:11.5px}
td{padding:9px 5px;border-bottom:1px solid var(--line2);vertical-align:top}
td.c{font-weight:900;font-size:13px;width:54px;white-space:nowrap}
td.g{color:#8FD8AB;font-weight:600}td.r{color:#E39B9B;font-weight:600}
.cd{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;background:var(--card)}
.cd h4{font-size:15px;font-weight:900}
.cd h4 .tier{font-size:9px;font-weight:800;color:var(--warn);border:1px solid #453520;border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:2px}
.cd .tag{font-size:11px;color:var(--blue);font-weight:600;margin:2px 0 9px}
.cd dl{display:grid;grid-template-columns:46px 1fr;gap:5px 9px;font-size:11.5px}
.cd dt{color:var(--dim2);font-weight:700}
.cd dd{line-height:1.55}
.cd ul{margin:0;padding-left:15px}
.cd .wn{color:var(--bad);font-weight:700}
.stat{font-size:10px;color:var(--dim2);margin-top:9px;border-top:1px solid var(--line2);padding-top:7px}
.ftr{margin-top:18px;font-size:10px;color:#4E5766;line-height:1.7;border-top:1px solid var(--line2);padding-top:11px}
</style>
</head>
<body><div class="wrap">

<header><h1>WR 원딜 픽</h1><span>Patch 7.2e</span></header>
<nav>
  <button class="on" data-p="pick">픽 찾기</button>
  <button data-p="sheet">치트시트</button>
  <button data-p="champ">챔프 상세</button>
</nav>

<section class="panel on" id="p-pick">
  <div id="hero"></div>
  <div id="hint" class="hint"></div>

  <details class="step" id="s-sup"><summary><span class="n">1</span>우리 서폿<span class="pick none">미선택</span></summary>
    <div class="body"><div class="chips" id="c-sup"></div></div></details>
  <details class="step" id="s-eadc"><summary><span class="n">2</span>상대 원딜<span class="pick none">미선택</span></summary>
    <div class="body"><div class="chips" id="c-eadc"></div></div></details>
  <details class="step" id="s-esup"><summary><span class="n">3</span>상대 서폿<span class="pick none">미선택</span></summary>
    <div class="body"><div class="chips" id="c-esup"></div></div></details>
  <details class="step" id="s-tr"><summary><span class="n">4</span>상대 조합<span class="pick none">미선택</span></summary>
    <div class="body"><div class="chips" id="c-tr"></div></div></details>
  <details class="step" id="s-our"><summary><span class="n">5</span>우리 조합<span class="pick none">미선택</span></summary>
    <div class="body"><div class="chips" id="c-our"></div></div></details>

  <button class="reset" id="reset">전부 초기화</button>
  <div class="rank" id="rank"></div>
</section>

<section class="panel" id="p-sheet">
  <table id="sheet"></table>
  <div class="ftr">초록 = 확실히 켜지는 조건 / 빨강 = 확실히 꺼지는 조건. 충돌하면 상대 조합이 서폿보다 우선.</div>
</section>

<section class="panel" id="p-champ"><div id="champs"></div></section>

<div class="ftr">근거: 챔피언 공략 영상 트랜스크립트(이즈리얼·베인·징크스·자야·루시안·애쉬·트위치) + 유나라 공략 + 통계(Wild Rift Core / wildriftmeta, Patch 7.2e). 근거가 없는 조합은 0(무난)으로 둔 것이지 검증된 값이 아님.</div>
</div>

const TRAITS = [

];

const SCORE_LABEL = { 2:'최적', 1:'좋음', 0:'무난', '-1':'비추', '-2':'금지' };

/* ---------- 우리 조합 ---------- */
const OURS = [
  { k:'우리팀에 이니시·탱커 있음', ex:'오른 레오나 아무무 세주아니',
    s:{jinx:2,vayne:2,twitch:2,yunara:1,ashe:1,xayah:0,ezreal:0,lucian:0},
    why:{jinx:'지켜주는 앞라인이 있으면 징크스 조건이 충족된다',vayne:'붙어 싸울 공간이 생긴다',twitch:'주도권을 팀이 만들어준다'} },
  { k:'우리팀에 CC가 거의 없음', ex:'딜러 위주 조합',

    why:{ashe:'R로 한타 시작권과 확정 CC를 혼자 만든다',lucian:'루시안도 CC가 없어 판을 굳힐 수단이 사라진다'} },
  { k:'우리팀이 초반에 강함', ex:'리신 판테온 드레이븐',
    s:{lucian:2,yunara:0,ashe:1,ezreal:-1,jinx:-1,twitch:-1,vayne:0,xayah:0},
    why:{lucian:'초반 스노우볼에 같이 올라탄다',ezreal:'혼자 후반을 보면 템포가 안 맞는다'} },
  { k:'우리팀이 후반 조합', ex:'케일 나서스 베이가',
    s:{jinx:2,vayne:1,twitch:1,ezreal:1,yunara:1,ashe:0,xayah:0,lucian:-2},
    why:{jinx:'같이 커서 한타로 끝낸다',lucian:'루시안은 후반에 무너져 조합과 어긋난다'} },
  { k:'우리팀에 암살자·다이브 있음', ex:'카타리나 리신 이블린',
    s:{ashe:2,lucian:1,ezreal:1,yunara:0,xayah:0,vayne:0,jinx:0,twitch:1},
    why:{ashe:'R 선타로 암살 각을 열어준다',twitch:'은신으로 같이 측면 진입'} },
];

/* ---------- 1픽 / 블라인드 ---------- */
const BLIND = [
  { id:'ezreal', why:'어떤 조합에서도 안 망한다. E로 빠질 수단이 있어 최악의 상황이 안 나옴. 대신 라인 주도권은 포기.' },
  { id:'yunara', why:'티어상 네 풀 최강이고 서폿을 안 가린다. 단 밴률 12%라 자주 잘리고, 애쉬·드레이븐·미포가 뒤에 나오면 불리해진다.' },
  { id:'xayah', why:'R 무적이라 상대가 뭘 뽑든 죽을 각이 줄어든다. 받아치는 챔프라 판을 먼저 만들진 못함.' },
];


const SEL={sup:null,eadc:null,esup:null,tr:new Set(),our:new Set()};
const MULTI={tr:1,our:1};
const $=s=>document.querySelector(s);
const byId=id=>CHAMPS.find(c=>c.id===id);

const SRC={sup:SUPPORTS,eadc:E_ADC,esup:E_SUP,tr:TRAITS,our:OURS};
const LBL={sup:s=>s.k,eadc:s=>s.k+(s.ban?' ⚠':''),esup:s=>s.k,tr:t=>t.label,our:o=>o.k};
const SUB={sup:s=>s.type,eadc:()=>'',esup:()=>'',tr:t=>t.ex,our:o=>o.ex};

Object.keys(SRC).forEach(k=>{
  $('#c-'+k).innerHTML = SRC[k].map((it,i)=>{
    const sb=SUB[k](it);
    return `<button class="chip" data-k="${k}" data-i="${i}">${LBL[k](it)}${sb?`<small class="ex">${sb}</small>`:''}</button>`;
  }).join('');
});

document.addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  const k=b.dataset.k,i=+b.dataset.i;
  if(MULTI[k]){ SEL[k].has(i)?SEL[k].delete(i):SEL[k].add(i); b.classList.toggle('on'); }
  else{
    const same=SEL[k]===i;
    document.querySelectorAll(`.chip[data-k="${k}"]`).forEach(x=>x.classList.remove('on'));
    SEL[k]=same?null:i; if(!same){b.classList.add('on'); $('#s-'+k).open=false;}
  }
  render();
});
$('#reset').onclick=()=>{
  SEL.sup=SEL.eadc=SEL.esup=null; SEL.tr.clear(); SEL.our.clear();
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.step').forEach(x=>x.open=false);
  render();
};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); $('#p-'+b.dataset.p).classList.add('on'); scrollTo(0,0);
});

function active(){
  const a=[];
  if(SEL.sup!=null) a.push(['우리 ',SUPPORTS[SEL.sup]]);
  if(SEL.eadc!=null) a.push(['상대 ',E_ADC[SEL.eadc]]);
  if(SEL.esup!=null) a.push(['상대 ',E_SUP[SEL.esup]]);
  SEL.tr.forEach(i=>a.push(['',TRAITS[i]]));
  SEL.our.forEach(i=>a.push(['',OURS[i]]));
  return a;
}
function evaluate(){
  const A=active();
  return CHAMPS.map(c=>{
    let sc=0; const rs=[];
    A.forEach(([pre,src])=>{
      const v=src.s?.[c.id]; if(v===undefined) return;
      sc+=v; const w=src.why?.[c.id];
      if(v!==0||w) rs.push({v,t:`<b>${pre}${src.label||src.k}</b>${w?' — '+w:''}`});
    });
    if(SEL.eadc!=null && E_ADC[SEL.eadc].k===c.name) rs.push({v:0,t:'<b>미러전</b> — 유불리 없음, 숙련도 싸움'});
    return {c,sc,rs};
  }).sort((a,b)=>b.sc-a.sc||CHAMPS.indexOf(a.c)-CHAMPS.indexOf(b.c));
}

const STEPS=[['sup','우리 서폿'],['eadc','상대 원딜'],['esup','상대 서폿'],['tr','상대 조합'],['our','우리 조합']];
function syncSteps(){
  STEPS.forEach(([k,name])=>{
    const el=$('#s-'+k), p=el.querySelector('.pick');
    let txt='';
    if(MULTI[k]) txt=[...SEL[k]].map(i=>(k==='tr'?TRAITS[i].label:OURS[i].k)).join(', ');
    else if(SEL[k]!=null) txt=SRC[k][SEL[k]].k;
    el.classList.toggle('done',!!txt);
    p.textContent=txt||'미선택'; p.classList.toggle('none',!txt);
  });
}
function nextHint(){
  const order=[['sup','우리 서폿이 뭔지'],['eadc','상대 원딜'],['esup','상대 서폿'],['tr','상대 조합 특성'],['our','우리 조합 특성']];
  const left=order.filter(([k])=>MULTI[k]?SEL[k].size===0:SEL[k]==null);
  if(!left.length) return '입력할 수 있는 건 다 넣었다. 위 추천이 최종 판단.';
  return `다음에 <b>${left[0][1]}</b>가 정해지면 더 좁혀진다. 모르면 건너뛰어도 됨.`;
}

function render(){
  syncSteps();
  const A=active(), list=evaluate();
  const warn = SEL.eadc!=null && E_ADC[SEL.eadc].ban ? E_ADC[SEL.eadc] : null;

  /* 1픽 / 정보 없음 */
  if(!A.length){
    const b=BLIND.map(x=>({c:byId(x.id),why:x.why}));
    $('#hero').innerHTML = `<div class="hero"><div class="lbl">1픽 · 정보 없을 때</div>
      <div class="big">${b[0].c.name}<em>${b[0].c.tier}</em></div>
      <div class="sub">${b[0].why}</div>
      <div class="alts"><b>대안</b>${b.slice(1).map(x=>`<span>${x.c.name}</span>`).join('')}</div></div>`;
    $('#hint').innerHTML = nextHint();
    $('#rank').innerHTML = `<h3>1픽 후보 근거</h3>` + b.map((x,i)=>`<div class="row">
      <div class="rk">${i+1}</div><div class="mid">
      <div class="nm">${x.c.name}<span class="tier">${x.c.tier}</span></div>
      <div class="rs"><div>${x.why}</div></div></div></div>`).join('');
    return;
  }

  const mirName = SEL.eadc!=null ? E_ADC[SEL.eadc].k : null;
  const nonMir = list.filter(r=>r.c.name!==mirName);
  const mirRow = mirName ? list.find(r=>r.c.name===mirName) : null;
  const top=(nonMir[0]||list[0]), best=top.sc;
  const ties=nonMir.filter(r=>r.sc===best&&best>0);
  let cls='hero', lbl='추천', sub='';
  if(best<=-1){ cls='hero badbox'; lbl='이 상황에 좋은 픽이 없음';
    sub='점수가 전부 마이너스다. 아래 1위가 그나마 덜 나쁜 선택이고, 밴이 가능하면 상대 픽을 자르는 게 낫다.'; }
  else if(best===0){ cls='hero warnbox'; lbl='뚜렷한 답이 없음';
    sub='유불리가 갈리지 않는 상황. 아래 순위대로 무난한 걸 고르면 된다.'; }
  else {
    const r=top.rs.filter(x=>x.v>0&&x.t.includes('—'));
    sub = r.length ? r.map(x=>x.t.replace(/<\/?b>/g,'')).join(' · ') : top.c.strength;
  }
  $('#hero').innerHTML =
    (warn?`<div class="hero warnbox"><div class="lbl">경고</div>
       <div class="big" style="font-size:19px">상대 ${warn.k}</div>
       <div class="sub">${warn.note}</div></div>`:'') +
    `<div class="${cls}"><div class="lbl">${lbl}</div>
      <div class="big">${top.c.name}<em>${top.c.tier}</em></div>
      <div class="sub">${sub}</div>
      ${ties.length>1?`<div class="alts"><b>동점</b>${ties.slice(1).map(t=>`<span>${t.c.name}</span>`).join('')}</div>`:''}
      ${mirRow?`<div class="alts"><b>미러</b><span>${mirRow.c.name} ${mirRow.sc>0?'+':''}${mirRow.sc}</span></div>`:''}
    </div>`;
  $('#hint').innerHTML = nextHint();

  $('#rank').innerHTML = `<h3>전체 순위</h3>` + list.map((r,i)=>`
    <div class="row${r.sc<=-2?' no':''}">
      <div class="rk">${i+1}</div>
      <div class="mid"><div class="nm">${r.c.name}<span class="tier">${r.c.tier}</span></div>
      ${r.rs.length?`<div class="rs">${r.rs.map(x=>
        `<div class="${x.v>0?'p':x.v<0?'m':''}">${x.v>0?'＋':x.v<0?'－':'·'} ${x.t}</div>`).join('')}</div>`:''}
      </div>
      <div class="sc ${r.sc>0?'p':r.sc<0?'m':'z'}">${r.sc>0?'+':''}${r.sc}</div>
    </div>`).join('');
}

/* 치트시트 */
(function(){
  const on={},off={}; CHAMPS.forEach(c=>{on[c.id]=[];off[c.id]=[];});
  const push=(src,pre)=>src.forEach(x=>CHAMPS.forEach(c=>{
    const v=x.s?.[c.id];
    if(v>=2) on[c.id].push(pre+(x.label||x.k));
    else if(v<=-2) off[c.id].push(pre+(x.label||x.k));
  }));
  push(SUPPORTS,'우리 '); push(E_ADC,'상대 '); push(E_SUP,'상대폿 '); push(TRAITS,''); push(OURS,'');
  $('#sheet').innerHTML = CHAMPS.map(c=>`<tr>
    <td class="c">${c.name}<br><span style="font-size:9px;color:var(--warn);font-weight:700">${c.tier}</span></td>
    <td class="g">${on[c.id].join(' · ')||'—'}</td>
    <td class="r">${off[c.id].join(' · ')||'—'}</td></tr>`).join('');
})();

/* 챔프 상세 */
$('#champs').innerHTML = CHAMPS.map(c=>`<div class="cd">
  <h4>${c.name}<span class="tier">${c.tier}</span></h4><div class="tag">${c.tag}</div>
  <dl><dt>핵심</dt><dd>${c.core}</dd><dt>강점</dt><dd>${c.strength}</dd><dt>약점</dt><dd>${c.weak}</dd>
  <dt>스펠</dt><dd>${c.spell}</dd><dt>빌드</dt><dd>${c.build}</dd><dt>룬</dt><dd>${c.runes}</dd>
  <dt>콤보</dt><dd><ul>${c.combo.map(x=>`<li>${x}</li>`).join('')}</ul></dd>
  ${c.tip?`<dt>팁</dt><dd>${c.tip}</dd>`:''}${c.warn?`<dt>주의</dt><dd class="wn">${c.warn}</dd>`:''}</dl>
  <div class="stat">${c.wr!=='—'?`승률 ${c.wr} · 픽률 ${c.pick} · 밴률 ${c.ban} · `:''}근거: ${c.src}</div>
</div>`).join('');

render();
</script>
